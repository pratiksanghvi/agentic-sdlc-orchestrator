[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-orchestrator"
version = "0.1.0"
description = "Governed agentic SDLC orchestrator: requirement -> approved spec -> design -> tests -> working service, with human gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "anthropic>=1.0,<2",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0",
    "rich>=14.0",
    "detect-secrets>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
